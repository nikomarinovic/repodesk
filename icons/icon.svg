    <ellipse cx="256" cy="70" rx="330" ry="190" fill="url(#glass)"/>

    <!-- mark: three soft layered panes, evokes a calm workspace stack -->
    <g>
      <rect x="146" y="238" width="150" height="150" rx="34" fill="#ffffff" fill-opacity="0.22"/>
      <rect x="196" y="192" width="170" height="170" rx="38" fill="#ffffff" fill-opacity="0.4"/>
      <rect x="176" y="146" width="190" height="190" rx="42" fill="url(#mark)"/>
      <path d="M240 244l32 34 62 -70" fill="none" stroke="#0f7fc4" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
