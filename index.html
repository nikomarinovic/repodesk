<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#38bdf8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RepoDesk">
<meta name="description" content="Your projects, tasks and GitHub activity in one calm workspace.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>RepoDesk</title>
<link rel="stylesheet" href="styles.css">
<script>
  // Apply theme before paint to avoid a flash of the wrong theme.
  (function () {
    try {
      var stored = JSON.parse(localStorage.getItem('repodesk.theme') || '"system"');
      var resolved = stored === 'system'
        ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        : stored;
      document.documentElement.setAttribute('data-theme', resolved);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
</head>
<body>

<div class="auth-orbs"><div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div></div>

<div id="auth-root"></div>

<div id="app" class="hidden">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <img src="icons/icon-192.png" alt="" class="brand-mark">
      <span class="brand-name">RepoDesk</span>
    </div>

    <nav class="sidebar-nav" id="sidebar-nav"></nav>

    <button class="sidebar-add" type="button" data-action="new-project">
      <span class="icon-plus"></span>
      New project
    </button>

    <div class="sidebar-account" id="sidebar-account"></div>
  </aside>

  <main class="main">
    <header class="topbar" id="topbar"></header>
    <div class="view-scroll">
      <section class="view" id="view-home"></section>
      <section class="view" id="view-projects"></section>
      <section class="view" id="view-news"></section>
      <section class="view" id="view-settings"></section>
    </div>
  </main>

  <nav class="bottom-nav" id="bottom-nav"></nav>

</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="app.js"></script>
</body>
</html>
